name: Python CI

on:
  pull_request:
    paths:
      - "sdk-python/**"
      - "specifications/**"
      - "docs/**"
      - "*.md" # root README, CONTRIBUTING, SECURITY, CODE_OF_CONDUCT: read by the link and docs tests
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "sdk-python/**"
      - "specifications/**"
      - "docs/**"
      - "*.md" # root README, CONTRIBUTING, SECURITY, CODE_OF_CONDUCT: read by the link and docs tests
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk-python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk-python/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk-python/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov=tradesmart

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: sdk-python/dist/
